service: marketDepthStreamLoop

package:
  artifact: dist/index.zip

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  memorySize: 512
  timeout: 900
  architecture: arm64
  logRetentionInDays: 60

functions:
  marketDepthStreamLoop:
    handler: index.handler
    name: marketDepthStreamLoop
    description: ${env:VERSION_DESCRIPTION}
    role: arn:aws:iam::987989283142:role/lambda-vpc-role
    # Capture lasts 635s with 15s reserved to flush. Overlap bridges normal
    # 600s scheduling/startup jitter; canonical event IDs deduplicate delivery.
    reservedConcurrency: 2
    events:
      - schedule: rate(10 minutes)
    vpc:
      securityGroupIds: ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):security}
      subnetIds: ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):subnets}
    environment:
      SENTRY_DSN: ${env:SENTRY_DSN}
      SENTRY_ENVIRONMENT: 'marketDepthStreamLoop_${opt:stage, self:provider.stage}'
