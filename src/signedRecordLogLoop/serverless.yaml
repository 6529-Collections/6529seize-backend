service: signedRecordLogLoop

package:
  artifact: dist/index.zip

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  memorySize: 1024
  timeout: 900
  architecture: arm64
  logRetentionInDays: 60

functions:
  signedRecordLogCloser:
    handler: index.handler
    name: signedRecordLogCloser
    description: ${env:VERSION_DESCRIPTION}
    role: arn:aws:iam::${aws:accountId}:role/lambda-vpc-role
    reservedConcurrency: 1
    events:
      - schedule:
          rate: rate(5 minutes)
          name: signedRecordLogLoop-${opt:stage, self:provider.stage}-close
    vpc:
      securityGroupIds: ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):security}
      subnetIds: ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):subnets}
    environment:
      SIGNED_RECORD_LOG_TASK: close
      SENTRY_DSN: ${env:SENTRY_DSN}
      SENTRY_ENVIRONMENT: "signedRecordLogCloser_${opt:stage, self:provider.stage}"
  signedRecordLogArchiver:
    handler: index.handler
    name: signedRecordLogArchiver
    description: ${env:VERSION_DESCRIPTION}
    role: arn:aws:iam::${aws:accountId}:role/lambda-vpc-role
    reservedConcurrency: 1
    events:
      - schedule:
          rate: cron(7 * * * ? *)
          name: signedRecordLogLoop-${opt:stage, self:provider.stage}-archive
    vpc:
      securityGroupIds: ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):security}
      subnetIds: ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):subnets}
    environment:
      SIGNED_RECORD_LOG_TASK: archive
      SENTRY_DSN: ${env:SENTRY_DSN}
      SENTRY_ENVIRONMENT: "signedRecordLogArchiver_${opt:stage, self:provider.stage}"

resources:
  Resources:
    SignedRecordLogCloserOOMFilter:
      Type: AWS::Logs::MetricFilter
      DependsOn: SignedRecordLogCloserLogGroup
      Properties:
        LogGroupName: /aws/lambda/signedRecordLogCloser
        FilterPattern: "Runtime.OutOfMemory"
        MetricTransformations:
          - MetricNamespace: "Lambda/OOM"
            MetricName: "signedRecordLogCloser_OOMErrorCount"
            MetricValue: "1"
            DefaultValue: 0

    SignedRecordLogCloserOOMAlarm:
      Type: AWS::CloudWatch::Alarm
      DependsOn: SignedRecordLogCloserOOMFilter
      Properties:
        AlarmName: !Sub "${AWS::StackName}-signedRecordLogCloser-OOM"
        AlarmDescription: !Sub "Lambda signedRecordLogCloser OutOfMemory in ${AWS::Region}"
        Namespace: "Lambda/OOM"
        MetricName: "signedRecordLogCloser_OOMErrorCount"
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):cwtopic}
        OKActions:
          - ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):cwtopic}

    SignedRecordLogArchiverOOMFilter:
      Type: AWS::Logs::MetricFilter
      DependsOn: SignedRecordLogArchiverLogGroup
      Properties:
        LogGroupName: /aws/lambda/signedRecordLogArchiver
        FilterPattern: "Runtime.OutOfMemory"
        MetricTransformations:
          - MetricNamespace: "Lambda/OOM"
            MetricName: "signedRecordLogArchiver_OOMErrorCount"
            MetricValue: "1"
            DefaultValue: 0

    SignedRecordLogArchiverOOMAlarm:
      Type: AWS::CloudWatch::Alarm
      DependsOn: SignedRecordLogArchiverOOMFilter
      Properties:
        AlarmName: !Sub "${AWS::StackName}-signedRecordLogArchiver-OOM"
        AlarmDescription: !Sub "Lambda signedRecordLogArchiver OutOfMemory in ${AWS::Region}"
        Namespace: "Lambda/OOM"
        MetricName: "signedRecordLogArchiver_OOMErrorCount"
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):cwtopic}
        OKActions:
          - ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):cwtopic}
