service: dropForgeLaunchHandler
package:
  artifact: dist/index.zip
provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'staging'}
  memorySize: 2048
  timeout: 300
  architecture: arm64
  logRetentionInDays: 60
functions:
  dropForgeLaunchHandler:
    handler: index.handler
    name: dropForgeLaunchHandler
    description: ${env:VERSION_DESCRIPTION}
    reservedConcurrency: 2
    role: ${file(../../serverless-config/${sls:stage}/drop-forge.js):launchRole}
    vpc:
      securityGroupIds: ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):security}
      subnetIds: ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):subnets}
    environment:
      DROP_FORGE_STAGE: ${sls:stage}
      DROP_FORGE_SCHEDULE_GROUP: drop-forge-${sls:stage}
      DROP_FORGE_SCHEDULER_ROLE_ARN: ${file(../../serverless-config/${sls:stage}/drop-forge.js):schedulerRole}
      SENTRY_DSN: ${env:SENTRY_DSN}
      SENTRY_ENVIRONMENT: dropForgeLaunchHandler_${opt:stage, self:provider.stage}
    events:
      - sqs:
          arn: !GetAtt WorkQueue.Arn
          batchSize: 1
          maximumConcurrency: 2
resources:
  Resources:
    LaunchScheduleGroup:
      Type: AWS::Scheduler::ScheduleGroup
      Properties:
        Name: drop-forge-${sls:stage}
    ReadinessPhase0:
      Type: AWS::Scheduler::Schedule
      Properties:
        Name: readiness-phase-0
        GroupName: !Ref LaunchScheduleGroup
        ScheduleExpression: cron(30 17 * * ? *)
        ScheduleExpressionTimezone: Europe/Athens
        FlexibleTimeWindow: { Mode: 'OFF' }
        Target:
          <<: &readinessTarget
            Arn: !GetAtt WorkQueue.Arn
            RoleArn: ${file(../../serverless-config/${sls:stage}/drop-forge.js):schedulerRole}
            DeadLetterConfig:
              Arn: !GetAtt WorkDLQ.Arn
            RetryPolicy:
              MaximumEventAgeInSeconds: 300
              MaximumRetryAttempts: 2
          Input: '{"id":"readiness:0:<aws.scheduler.scheduled-time>","revision":0}'
    ReadinessPhase1:
      Type: AWS::Scheduler::Schedule
      Properties:
        Name: readiness-phase-1
        GroupName: !Ref LaunchScheduleGroup
        ScheduleExpression: cron(28 18 * * ? *)
        ScheduleExpressionTimezone: Europe/Athens
        FlexibleTimeWindow: { Mode: 'OFF' }
        Target:
          <<: *readinessTarget
          Input: '{"id":"readiness:1:<aws.scheduler.scheduled-time>","revision":0}'
    ReadinessPhase2:
      Type: AWS::Scheduler::Schedule
      Properties:
        Name: readiness-phase-2
        GroupName: !Ref LaunchScheduleGroup
        ScheduleExpression: cron(58 18 * * ? *)
        ScheduleExpressionTimezone: Europe/Athens
        FlexibleTimeWindow: { Mode: 'OFF' }
        Target:
          <<: *readinessTarget
          Input: '{"id":"readiness:2:<aws.scheduler.scheduled-time>","revision":0}'
    ReadinessPhase3:
      Type: AWS::Scheduler::Schedule
      Properties:
        Name: readiness-phase-3
        GroupName: !Ref LaunchScheduleGroup
        ScheduleExpression: cron(22 19 * * ? *)
        ScheduleExpressionTimezone: Europe/Athens
        FlexibleTimeWindow: { Mode: 'OFF' }
        Target:
          <<: *readinessTarget
          Input: '{"id":"readiness:3:<aws.scheduler.scheduled-time>","revision":0}'
    WorkQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: drop-forge-launch
        SqsManagedSseEnabled: true
        VisibilityTimeout: 1800
        MessageRetentionPeriod: 1209600
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt WorkDLQ.Arn
          maxReceiveCount: 10
    WorkDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: drop-forge-launch-dlq
        SqsManagedSseEnabled: true
        MessageRetentionPeriod: 1209600
    WorkDLQAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Queued operations need operator inspection and redrive; do not reset transaction ledgers
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: drop-forge-launch-dlq
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - ${file(../../serverless-config/${sls:stage}/vpc.js):cwtopic}
    DropForgeLaunchErrorAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: !Sub '${AWS::StackName}-dropForgeLaunchHandler-errors'
        AlarmDescription: Drop Forge invocation or configuration failed; inspect the durable launch ledger
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: dropForgeLaunchHandler
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):cwtopic}
