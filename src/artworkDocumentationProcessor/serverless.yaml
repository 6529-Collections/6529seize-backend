service: artworkDocumentationProcessor

package:
  artifact: dist/index.zip

provider:
  name: aws
  runtime: nodejs22.x
  memorySize: 2048
  timeout: 900
  architecture: x86_64
  logRetentionInDays: 60

functions:
  artworkDocumentationProcessor:
    handler: index.handler
    name: artworkDocumentationProcessor
    description: ${env:VERSION_DESCRIPTION, ''}
    role: arn:aws:iam::987989283142:role/lambda-vpc-role
    reservedConcurrency: 1
    ephemeralStorageSize: 1024
    events:
      - schedule: rate(1 minute)
    vpc:
      securityGroupIds: ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):security}
      subnetIds: ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):subnets}
    environment:
      SENTRY_DSN: ${env:SENTRY_DSN, ''}
      SENTRY_ENVIRONMENT: artworkDocumentationProcessor_${opt:stage, self:provider.stage}
      ARTWORK_DOCUMENTATION_S3_BUCKET: !Sub '6529-artwork-documentation-${AWS::AccountId}-${AWS::Region}'
      ARTWORK_DOCUMENTATION_S3_REGION: ${opt:region}

resources:
  Resources:
    ArtworkDocumentationProcessorErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Artwork documentation worker failed; check durable processing queue before enabling uploads.
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: artworkDocumentationProcessor
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
