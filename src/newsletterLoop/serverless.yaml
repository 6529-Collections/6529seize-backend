service: newsletterLoop

package:
  artifact: dist/index.zip

provider:
  name: aws
  stage: prod
  runtime: nodejs22.x
  memorySize: 1024
  timeout: 900
  architecture: arm64
  logRetentionInDays: 60

functions:
  newsletterLoop:
    handler: index.handler
    name: newsletterLoop
    description: ${env:VERSION_DESCRIPTION}
    role: arn:aws:iam::987989283142:role/lambda-vpc-role
    reservedConcurrency: 1
    events:
      - schedule:
          # EventBridge rules use UTC and retain their original event timestamp.
          rate: cron(0 0 * * ? *)
          enabled: true
    vpc:
      securityGroupIds: ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):security}
      subnetIds: ${file(../../serverless-config/${opt:stage, self:provider.stage}/vpc.js):subnets}
    environment:
      NEWSLETTER_STAGE: ${opt:stage, self:provider.stage}
      SENTRY_DSN: ${env:SENTRY_DSN}
      SENTRY_ENVIRONMENT: newsletterLoop_${opt:stage, self:provider.stage}
