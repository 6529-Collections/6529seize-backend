<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Museum publication viewer check</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Manual, local-only render check for compiled publication manifests.
      It is never run in CI and never served by the API.

      From the repository root:
        python3 -m http.server 8787
      then open
        http://127.0.0.1:8787/scripts/museum-publication-viewer.html?manifest=/src/artwork-documentation/museum/fixtures/publication/still-image.json

      Mirador loads from its public CDN. Fixture media URLs point at the
      documented placeholder host (media.example) and will not resolve, so the
      check confirms manifest structure, labels, rights and credit rendering,
      not image delivery.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #note {
        padding: 0.5rem 1rem;
        background: #111;
        color: #eee;
        font-size: 0.9rem;
      }
      #mirador {
        position: absolute;
        top: 2.5rem;
        bottom: 0;
        left: 0;
        right: 0;
      }
    </style>
  </head>
  <body>
    <div id="note"></div>
    <div id="mirador"></div>
    <script src="https://unpkg.com/mirador@3.3.0/dist/mirador.min.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var manifest = params.get('manifest');
        var note = document.getElementById('note');
        if (!manifest || !/^\/[A-Za-z0-9._\/-]+\.json$/.test(manifest)) {
          note.textContent =
            'Pass ?manifest=/src/artwork-documentation/museum/fixtures/publication/<case>.json (a local path served by python -m http.server).';
          return;
        }
        note.textContent =
          'Loading ' +
          manifest +
          ' in Mirador 3 (local structural check; fixture media will not resolve).';
        Mirador.viewer({
          id: 'mirador',
          windows: [{ manifestId: window.location.origin + manifest }],
          window: { allowClose: false, sideBarOpenByDefault: true }
        });
      })();
    </script>
  </body>
</html>
