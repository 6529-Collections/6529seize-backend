name: Complete backend production authority

on:
  workflow_run:
    workflows:
      - Deploy a service
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  complete:
    if: github.event.workflow_run.repository.full_name == '6529-Collections/6529seize-backend'
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact completed backend production run and evidence artifact
        id: identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          BACKEND_REPOSITORY: 6529-Collections/6529seize-backend
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = "$BACKEND_REPOSITORY"
          [[ "$DEPLOY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          run_file="$(mktemp)"
          artifact_file="$(mktemp)"
          trap 'rm -f "$run_file" "$artifact_file"' EXIT
          run_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 60 --max-filesize 262144 \
            --output "$run_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$BACKEND_REPOSITORY/actions/runs/$DEPLOY_RUN_ID")"
          test "$run_status" = 200
          jq -e \
            --arg run_id "$DEPLOY_RUN_ID" \
             'type == "object" and .id == ($run_id | tonumber) and
             .repository.full_name == "6529-Collections/6529seize-backend" and
             .head_repository.full_name == "6529-Collections/6529seize-backend" and
             .name == "Deploy a service" and
             .path == ".github/workflows/deploy.yml" and
             .event == "workflow_dispatch" and .head_branch == "main" and
             (.head_sha | type == "string" and test("^[a-f0-9]{40}$")) and
             (.run_attempt | type == "number" and . >= 1 and . <= 1000000) and
             .status == "completed" and (.conclusion | type == "string") and
             (.display_title | type == "string")' \
            "$run_file" > /dev/null
          title="$(jq -er '.display_title' "$run_file")"
          if [[ "$title" =~ ^Deploy[[:space:]]([A-Za-z0-9]+)[[:space:]]to[[:space:]]prod[[:space:]]\[backend-prod-([A-Za-z0-9]+)-([1-9][0-9]{0,19})\]$ ]]; then
            service="${BASH_REMATCH[1]}"
            title_service="${BASH_REMATCH[2]}"
            title_run_id="${BASH_REMATCH[3]}"
          else
            {
              echo 'manual_prod=false'
              echo 'conclusion=ignored'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$service" = "$title_service"
          test "$title_run_id" = "$DEPLOY_RUN_ID"
          operation_id="backend-prod-$service-$DEPLOY_RUN_ID"
          conclusion="$(jq -er '.conclusion' "$run_file")"
          case "$conclusion" in
            success|failure|cancelled|timed_out|action_required|stale|startup_failure) ;;
            *) echo 'Unexpected completed workflow conclusion' >&2; exit 1 ;;
          esac
          target_sha="$(jq -er '.head_sha' "$run_file")"
          run_attempt="$(jq -er '.run_attempt' "$run_file")"
          artifact_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 60 --max-filesize 262144 \
            --output "$artifact_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$BACKEND_REPOSITORY/actions/runs/$DEPLOY_RUN_ID/artifacts?per_page=100")"
          test "$artifact_status" = 200
          jq -e 'type == "object" and (.artifacts | type == "array" and length <= 100)' "$artifact_file" > /dev/null
          {
            echo 'manual_prod=true'
            echo "conclusion=$conclusion"
            echo "service=$service"
            echo "operation_id=$operation_id"
            echo "target_sha=$target_sha"
            echo "workflow_run_attempt=$run_attempt"
          } >> "$GITHUB_OUTPUT"
          if [ "$conclusion" = success ]; then
            expected_artifact="backend-production-authority-$DEPLOY_RUN_ID"
            artifact_count="$(jq -r --arg name "$expected_artifact" '[.artifacts[] | select(.name == $name)] | length' "$artifact_file")"
            test "$artifact_count" = 1
            artifact_json="$(jq -c --arg name "$expected_artifact" '[.artifacts[] | select(.name == $name)][0]' "$artifact_file")"
            jq -e \
              '.expired == false and
               (.id | type == "number" and . >= 1) and
               (.size_in_bytes | type == "number" and . >= 1 and . <= 65536)' \
              <<< "$artifact_json" > /dev/null
            echo "evidence_artifact_name=$expected_artifact" >> "$GITHUB_OUTPUT"
          else
            expected_artifact="backend-production-authority-failure-$DEPLOY_RUN_ID"
            artifact_count="$(jq -r --arg name "$expected_artifact" '[.artifacts[] | select(.name == $name)] | length' "$artifact_file")"
            if [ "$artifact_count" = 0 ]; then
              echo 'failure_artifact_available=false' >> "$GITHUB_OUTPUT"
            elif [ "$artifact_count" = 1 ]; then
              artifact_json="$(jq -c --arg name "$expected_artifact" '[.artifacts[] | select(.name == $name)][0]' "$artifact_file")"
              jq -e \
                '.expired == false and
                 (.id | type == "number" and . >= 1) and
                 (.size_in_bytes | type == "number" and . >= 1 and . <= 65536)' \
                <<< "$artifact_json" > /dev/null
              echo 'failure_artifact_available=true' >> "$GITHUB_OUTPUT"
              echo "failure_artifact_name=$expected_artifact" >> "$GITHUB_OUTPUT"
            else
              echo 'Duplicate backend production authority failure artifacts' >&2
              exit 1
            fi
          fi

      - name: Download exact backend production authority evidence
        if: steps.identity.outputs.manual_prod == 'true' && steps.identity.outputs.conclusion == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: ${{ steps.identity.outputs.evidence_artifact_name }}
          path: authority-evidence
          merge-multiple: false

      - name: Verify immutable evidence and complete backend authority
        if: steps.identity.outputs.manual_prod == 'true' && steps.identity.outputs.conclusion == 'success'
        shell: bash
        env:
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_RUN_ATTEMPT: ${{ steps.identity.outputs.workflow_run_attempt }}
          OPERATION_ID: ${{ steps.identity.outputs.operation_id }}
          SERVICE: ${{ steps.identity.outputs.service }}
          TARGET_SHA: ${{ steps.identity.outputs.target_sha }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_BUS_API_URL"
          test -n "$RELEASE_BUS_WORKFLOW_AUTH_TOKEN"
          [[ "$DEPLOY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$DEPLOY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$SERVICE" =~ ^[A-Za-z0-9]+$ ]]
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          evidence_file="authority-evidence/backend-production-authority-evidence.json"
          test -f "$evidence_file"
          test ! -L "$evidence_file"
          mapfile -t evidence_files < <(find authority-evidence -type f -printf '%P\n' | LC_ALL=C sort)
          test "${#evidence_files[@]}" = 1
          test "${evidence_files[0]}" = backend-production-authority-evidence.json
          test "$(stat -c '%s' "$evidence_file")" -le 65536
          jq -e \
            --arg operation_id "$OPERATION_ID" \
            --arg service "$SERVICE" \
            --arg target_sha "$TARGET_SHA" \
            --arg workflow_run_id "$DEPLOY_RUN_ID" \
            --argjson workflow_run_attempt "$DEPLOY_RUN_ATTEMPT" \
            'type == "object" and
             (keys_unsorted | sort) == [
               "controller_identity", "deployment_result", "environment",
               "evidence_type", "operation_id", "repository", "schema_version",
               "selection", "selection_digest", "service", "target_sha",
               "workflow_run_attempt", "workflow_run_id"
             ] and
             .evidence_type == "backend-production-authority-v1" and
             .schema_version == 1 and .controller_identity == "backend-production-workflow" and
             .repository == "backend" and .environment == "prod" and
             .service == $service and .operation_id == $operation_id and
             .target_sha == $target_sha and .workflow_run_id == $workflow_run_id and
             .workflow_run_attempt == $workflow_run_attempt and
             .deployment_result == "success" and
             (.selection_digest | type == "string" and test("^[a-f0-9]{64}$"))' \
            "$evidence_file" > /dev/null
          jq -e \
            --arg service "$SERVICE" \
            --arg target_sha "$TARGET_SHA" \
            --arg workflow_run_id "$DEPLOY_RUN_ID" \
            --argjson workflow_run_attempt "$DEPLOY_RUN_ATTEMPT" \
            '.selection | type == "object" and
             (keys_unsorted | sort) == [
               "artifact_kind", "environment", "package_bytes", "package_digest",
               "package_path", "repository", "schema_version", "selection_type",
               "service", "target_sha", "workflow_run_attempt", "workflow_run_id"
             ] and
             .schema_version == 1 and
             .selection_type == "backend-production-deployment-selection-v1" and
             .repository == "backend" and .environment == "prod" and
             .service == $service and .target_sha == $target_sha and
             .workflow_run_id == $workflow_run_id and
             .workflow_run_attempt == $workflow_run_attempt and
             .artifact_kind == "lambda-zip" and
             (.package_path | type == "string" and test("^src/(api-serverless|[A-Za-z0-9]+)/dist/index\\.zip$")) and
             (.package_digest | type == "string" and test("^[a-f0-9]{64}$")) and
             (.package_bytes | type == "number" and . >= 1 and . <= 524288000)' \
            "$evidence_file" > /dev/null
          selection_json="$(jq -cS '.selection' "$evidence_file")"
          selection_digest="$(printf '%s' "$selection_json" | sha256sum | cut -d' ' -f1)"
          test "$selection_digest" = "$(jq -er '.selection_digest' "$evidence_file")"
          evidence_digest="$(sha256sum "$evidence_file" | cut -d' ' -f1)"
          payload="$(jq -cn \
            --arg operation_id "$OPERATION_ID" \
            --arg controller_identity backend-production-workflow \
            --arg repository backend \
            --arg environment prod \
            --arg service "$SERVICE" \
            --arg target_sha "$TARGET_SHA" \
            --arg workflow_run_id "$DEPLOY_RUN_ID" \
            --argjson workflow_run_attempt "$DEPLOY_RUN_ATTEMPT" \
            --arg selection_digest "$selection_digest" \
            --arg qualifier_workflow_run_id "$DEPLOY_RUN_ID" \
            --argjson qualifier_workflow_run_attempt "$DEPLOY_RUN_ATTEMPT" \
            --arg evidence_digest "$evidence_digest" \
            '{operation_id:$operation_id,controller_identity:$controller_identity,
              repository:$repository,environment:$environment,service:$service,
              target_sha:$target_sha,workflow_run_id:$workflow_run_id,
              workflow_run_attempt:$workflow_run_attempt,
              selection_digest:$selection_digest,
              qualifier_workflow_run_id:$qualifier_workflow_run_id,
              qualifier_workflow_run_attempt:$qualifier_workflow_run_attempt,
              evidence_digest:$evidence_digest}')"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 300 \
            --connect-timeout 10 --max-time 60 --max-filesize 32768 \
            --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_BUS_API_URL/deploy/release-bus-v2/production-authority/complete")"
          test "$http_status" = 200
          jq -e \
            --arg operation_id "$OPERATION_ID" \
            'type == "object" and
             (keys_unsorted | sort) == ["completed", "lock_row_version", "operation_id", "reused", "status"] and
             .completed == true and .status == "COMPLETED" and .operation_id == $operation_id and
             (.reused | type == "boolean") and
             (.lock_row_version == null or (.lock_row_version | type == "number" and . >= 1))' \
            "$response_file" > /dev/null

      - name: Download exact backend production authority failure state
        if: always() && steps.identity.outputs.manual_prod == 'true' && steps.identity.outputs.conclusion != 'success' && steps.identity.outputs.failure_artifact_available == 'true'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: ${{ steps.identity.outputs.failure_artifact_name }}
          path: authority-failure
          merge-multiple: false

      - name: Fail exact failed backend production authority
        if: always() && steps.identity.outputs.manual_prod == 'true' && steps.identity.outputs.conclusion != 'success'
        shell: bash
        env:
          RELEASE_BUS_API_URL: ${{ vars.RELEASE_BUS_API_URL }}
          RELEASE_BUS_WORKFLOW_AUTH_TOKEN: ${{ secrets.RELEASE_BUS_WORKFLOW_AUTH_TOKEN }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_RUN_ATTEMPT: ${{ steps.identity.outputs.workflow_run_attempt }}
          OPERATION_ID: ${{ steps.identity.outputs.operation_id }}
          SERVICE: ${{ steps.identity.outputs.service }}
          TARGET_SHA: ${{ steps.identity.outputs.target_sha }}
          CONCLUSION: ${{ steps.identity.outputs.conclusion }}
        run: |
          set -euo pipefail
          umask 077
          state_file="authority-failure/backend-production-authority-failure.json"
          if [ ! -f "$state_file" ]; then
            echo 'Exact backend failure state artifact was not available; authority remains fail-closed until expiry.' >&2
            exit 1
          fi
          test ! -L "$state_file"
          mapfile -t failure_files < <(find authority-failure -type f -printf '%P\n' | LC_ALL=C sort)
          test "${#failure_files[@]}" = 1
          test "${failure_files[0]}" = backend-production-authority-failure.json
          test "$(stat -c '%s' "$state_file")" -ge 1
          test "$(stat -c '%s' "$state_file")" -le 65536
          jq -e \
            --arg operation_id "$OPERATION_ID" \
            --arg service "$SERVICE" \
            --arg target_sha "$TARGET_SHA" \
            --arg workflow_run_id "$DEPLOY_RUN_ID" \
            --argjson workflow_run_attempt "$DEPLOY_RUN_ATTEMPT" \
            'type == "object" and
             (keys_unsorted | sort) == [
               "controller_identity", "environment", "operation_id", "repository",
               "schema_version", "selection_digest", "service", "state_type",
               "target_sha", "workflow_run_attempt", "workflow_run_id"
             ] and
             .schema_version == 1 and .state_type == "backend-production-authority-state-v1" and
             .controller_identity == "backend-production-workflow" and .repository == "backend" and
             .environment == "prod" and .operation_id == $operation_id and .service == $service and
             .target_sha == $target_sha and .workflow_run_id == $workflow_run_id and
             .workflow_run_attempt == $workflow_run_attempt and
             (.selection_digest == null or
              (.selection_digest | type == "string" and test("^[a-f0-9]{64}$")))' \
            "$state_file" > /dev/null
          selection_json="$(jq -c '.selection_digest' "$state_file")"
          evidence_digest="$(sha256sum "$state_file" | cut -d' ' -f1)"
          [[ "$evidence_digest" =~ ^[a-f0-9]{64}$ ]]
          case "$CONCLUSION" in
            cancelled) reason_code=ABORTED ;;
            failure|timed_out|action_required|stale|startup_failure)
              reason_code=WORKFLOW_FAILED
              ;;
            *)
              echo "Unsupported terminal workflow conclusion: $CONCLUSION" >&2
              exit 1
              ;;
          esac
          payload="$(jq -cn \
            --arg operation_id "$OPERATION_ID" \
            --arg controller_identity backend-production-workflow \
            --arg repository backend \
            --arg environment prod \
            --arg service "$SERVICE" \
            --arg target_sha "$TARGET_SHA" \
            --arg workflow_run_id "$DEPLOY_RUN_ID" \
            --argjson workflow_run_attempt "$DEPLOY_RUN_ATTEMPT" \
            --argjson selection_digest "$selection_json" \
            --arg qualifier_workflow_run_id "$DEPLOY_RUN_ID" \
            --argjson qualifier_workflow_run_attempt "$DEPLOY_RUN_ATTEMPT" \
            --arg evidence_digest "$evidence_digest" \
            --arg reason_code "$reason_code" \
            '{operation_id:$operation_id,controller_identity:$controller_identity,
              repository:$repository,environment:$environment,service:$service,
              target_sha:$target_sha,workflow_run_id:$workflow_run_id,
              workflow_run_attempt:$workflow_run_attempt,
              selection_digest:$selection_digest,
              qualifier_workflow_run_id:$qualifier_workflow_run_id,
              qualifier_workflow_run_attempt:$qualifier_workflow_run_attempt,
              evidence_digest:$evidence_digest,reason_code:$reason_code}')"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 300 \
            --connect-timeout 10 --max-time 60 --max-filesize 32768 \
            --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer $RELEASE_BUS_WORKFLOW_AUTH_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$RELEASE_BUS_API_URL/deploy/release-bus-v2/production-authority/fail")"
          test "$http_status" = 200
          jq -e \
            --arg operation_id "$OPERATION_ID" \
            'type == "object" and
             (keys_unsorted | sort) == ["failed", "lock_row_version", "operation_id", "reused", "status"] and
             .failed == true and .status == "FAILED" and .operation_id == $operation_id and
             (.reused | type == "boolean") and
             (.lock_row_version == null or (.lock_row_version | type == "number" and . >= 1))' \
            "$response_file" > /dev/null
