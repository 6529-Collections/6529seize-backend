name: Build backend and API on pull request

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build backend and API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.17.1'
          cache: 'npm'
      - name: Check package manager discipline
        run: node scripts/check-package-manager.mjs
      - name: Activate pinned npm via Corepack
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          expected="$(node -p "String(require('./package.json').packageManager ?? '').split('npm@')[1]?.split('+')[0] ?? ''")"
          if [[ -z "${expected}" ]]; then
            echo "::error::package.json has no npm packageManager pin; the discipline check should have caught this."
            exit 1
          fi
          corepack enable npm
          corepack install
          resolved="$(npm --version)"
          echo "npm resolved to ${resolved} (pinned ${expected})"
          if [[ "${resolved}" != "${expected}" ]]; then
            echo "::error::Corepack did not activate the pinned npm (expected ${expected}, got ${resolved})."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci && pushd src/api-serverless && npm ci && popd
      - name: Verify generated files are committed
        run: |
          npm run generate:deploy-config
          if [[ -n "$(git status --porcelain -- .github/workflows/deploy.yml)" ]]; then
            echo "::error::.github/workflows/deploy.yml is generated. Edit config/deploy-services.json, rerun npm run generate:deploy-config, and commit the result."
            git diff --stat -- .github/workflows/deploy.yml
            exit 1
          fi

          pushd src/api-serverless
          npm run generate
          popd

          if [[ -n "$(git status --porcelain -- src/api-serverless/src/generated)" ]]; then
            echo "::error::src/api-serverless/src/generated is generated from openapi.yaml. Rerun src/api-serverless generation and commit the result."
            git diff --stat -- src/api-serverless/src/generated
            exit 1
          fi
      - name: Lint
        run: |
          npm run lint:check
          npm run ci:assert-source-clean
      - name: Format
        run: |
          npm run format:check
          npm run ci:assert-source-clean
      - name: Build backend
        run: npm run build
      - name: Build API
        run: pushd src/api-serverless && npm run build && popd
      - name: Bind exact PR merge-tree CI evidence
        env:
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MERGE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          mkdir -p release-bus-v2-pr-artifact
          bundle_metadata="$(node scripts/pr-ci-policy-bundle.cjs --output release-bus-v2-pr-artifact/policy-bundle.txt --expected-git-ref "$EXPECTED_MERGE_SHA")"
          policy_bundle_contract="$(jq -er '.contract' <<<"$bundle_metadata")"
          policy_bundle_digest="$(jq -er '.digest' <<<"$bundle_metadata")"
          policy_bundle_line_count="$(jq -er '.line_count' <<<"$bundle_metadata")"
          [[ "$policy_bundle_contract" = "pr-ci-policy-bundle-v1" ]]
          [[ "$policy_bundle_digest" =~ ^[a-f0-9]{64}$ ]]
          [[ "$policy_bundle_line_count" =~ ^[1-9][0-9]*$ ]]
          jq -n \
            --arg merge_sha "$EXPECTED_MERGE_SHA" \
            --arg head_sha "$EXPECTED_PR_HEAD_SHA" \
            --arg policy_bundle_contract "$policy_bundle_contract" \
            --arg policy_bundle_digest "$policy_bundle_digest" \
            --argjson policy_bundle_line_count "$policy_bundle_line_count" \
            '{
              schema_version:1,
              evidence_contract:"exact-merge-tree-pr-ci-v1",
              repository:"backend",
              merge_sha:$merge_sha,
              head_sha:$head_sha,
              workflow:".github/workflows/on-pull-request.yml",
              policy_bundle_contract:$policy_bundle_contract,
              policy_bundle_digest:$policy_bundle_digest,
              policy_bundle_line_count:$policy_bundle_line_count,
              required_gates:[
                "generated-files",
                "lint",
                "format",
                "backend-test-and-typecheck",
                "api-build",
                "pr-ci-policy-bundle"
              ]
            }' > release-bus-v2-pr-artifact/manifest.json
          (cd release-bus-v2-pr-artifact && find . -type f ! -path ./SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload exact PR merge-tree CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bus-v2-pr-${{ github.sha }}
          path: release-bus-v2-pr-artifact
          if-no-files-found: error
          retention-days: 30
