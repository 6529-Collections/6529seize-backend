name: Build backend and API on pull request

on:
  pull_request:
    branches:
      - main

concurrency:
  group: backend-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.17.1'
          cache: 'npm'
      - name: Check package manager discipline
        run: ./bin/6529 run package-manager:check
      - name: Verify patched C2PA package against pinned upstream
        run: python3 scripts/build-c2pa-package.py --check
      - name: Verify pinned npm through the 6529 wrapper
        shell: bash
        run: |
          expected="$(node -p "String(require('./package.json').packageManager ?? '').split('npm@')[1]?.split('+')[0] ?? ''")"
          if [[ -z "${expected}" ]]; then
            echo "::error::package.json has no npm packageManager pin; the discipline check should have caught this."
            exit 1
          fi
          resolved="$(./bin/6529 npm:version)"
          echo "npm resolved to ${resolved} (pinned ${expected})"
          if [[ "${resolved}" != "${expected}" ]]; then
            echo "::error::The 6529 wrapper did not resolve the pinned npm (expected ${expected}, got ${resolved})."
            exit 1
          fi
      - name: Install dependencies
        run: ./bin/6529 ci && pushd src/api-serverless && ../../bin/6529 ci && popd
      - name: Verify generated files are committed
        run: |
          ./bin/6529 run generate:deploy-config
          if [[ -n "$(git status --porcelain -- .github/workflows/deploy.yml)" ]]; then
            echo "::error::.github/workflows/deploy.yml is generated. Edit config/deploy-services.json, rerun 6529 run generate:deploy-config, and commit the result."
            git diff --stat -- .github/workflows/deploy.yml
            exit 1
          fi

          pushd src/api-serverless
          ../../bin/6529 run generate
          popd

          if [[ -n "$(git status --porcelain -- src/api-serverless/src/generated)" ]]; then
            echo "::error::src/api-serverless/src/generated is generated from openapi.yaml. From src/api-serverless, rerun 6529 run generate:openapi and commit the result."
            git diff --stat -- src/api-serverless/src/generated
            exit 1
          fi
      - name: Lint
        run: |
          ./bin/6529 run lint:check
          ./bin/6529 run ci:assert-source-clean
      - name: Format
        run: |
          ./bin/6529 run format:check
          ./bin/6529 run ci:assert-source-clean
      - name: Build backend
        run: ./bin/6529 run build:ci
      - name: Build API
        run: pushd src/api-serverless && ../../bin/6529 run build && popd

  test:
    name: Test backend (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.17.1'
          cache: 'npm'
      - name: Install dependencies
        run: ./bin/6529 ci && pushd src/api-serverless && ../../bin/6529 ci && popd
      - name: Test backend shard
        # Preserve the existing worker, heap and timeout limits on each runner.
        timeout-minutes: 45
        env:
          SHARD: ${{ matrix.shard }}
          LC_ALL: C
        run: |
          set -euo pipefail
          rm -rf pr-ci-jest-inventory
          mkdir -p pr-ci-jest-inventory
          NODE_ENV=test ./bin/6529 exec jest --listTests \
            | sed "s|^${GITHUB_WORKSPACE}/||" \
            | sort -u > "pr-ci-jest-inventory/complete-$SHARD.txt"
          test -s "pr-ci-jest-inventory/complete-$SHARD.txt"
          NODE_ENV=test ./bin/6529 exec jest --listTests --shard="$SHARD/4" \
            | sed "s|^${GITHUB_WORKSPACE}/||" \
            | sort -u > "pr-ci-jest-inventory/shard-$SHARD.txt"
          test -s "pr-ci-jest-inventory/shard-$SHARD.txt"
          NODE_ENV=test NODE_OPTIONS=--max-old-space-size=3072 \
            ./bin/6529 exec jest --maxWorkers=2 --shard="$SHARD/4"
          ./bin/6529 run ci:assert-source-clean
      - name: Upload shard inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-ci-jest-inventory-${{ matrix.shard }}
          path: pr-ci-jest-inventory/*.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build:
    # Keep the existing required check name; every prerequisite must succeed.
    name: Build backend and API
    runs-on: ubuntu-latest
    needs: [checks, test]
    if: ${{ always() }}
    steps:
      - name: Require all checks and shards to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TEST_RESULT" = success
      - name: Download shard inventories
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pr-ci-jest-inventory-*
          path: pr-ci-jest-inventory
          merge-multiple: true
      - name: Verify every test belongs to exactly one shard
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          for shard in 1 2 3 4; do
            test -s "pr-ci-jest-inventory/complete-$shard.txt"
            test -s "pr-ci-jest-inventory/shard-$shard.txt"
            diff -u pr-ci-jest-inventory/complete-1.txt \
              "pr-ci-jest-inventory/complete-$shard.txt"
          done
          sort pr-ci-jest-inventory/complete-1.txt > complete.sorted
          cat pr-ci-jest-inventory/shard-*.txt | sort > shards.sorted
          test -z "$(uniq -d shards.sorted)"
          test "$(wc -l < shards.sorted)" -eq "$(wc -l < complete.sorted)"
          diff -u complete.sorted shards.sorted
