name: Deploy operational monitoring
on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [staging, prod]
      operation:
        description: Deploy runtime or remove only the retired competition producer registration
        required: false
        type: choice
        default: deploy
        options: [deploy, retire-competition-registration]
      retirement_plan_sha256:
        description: Leave empty to propose retirement; apply only the exact plan SHA-256 from the prior receipt
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: operational-monitoring-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  monitoring:
    environment: monitoring-${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify environment branch
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_OPERATION: ${{ inputs.operation || 'deploy' }}
          RETIRE_APPROVED_PLAN_SHA256: ${{ inputs.retirement_plan_sha256 }}
        run: |
          case "${DEPLOY_OPERATION:-deploy}" in
            deploy|retire-competition-registration) ;;
            *) echo "Unsupported monitoring operation" >&2; exit 1 ;;
          esac
          if [[ -n "${RETIRE_APPROVED_PLAN_SHA256:-}" ]]; then
            if [[ "${DEPLOY_OPERATION:-deploy}" != retire-competition-registration || ! "$RETIRE_APPROVED_PLAN_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
              echo "Retirement confirmation requires the exact proposed SHA-256 and retirement operation" >&2
              exit 1
            fi
          fi
          case "$DEPLOY_ENVIRONMENT" in
            prod) expected_ref=refs/heads/main ;;
            staging) expected_ref=refs/heads/1a-staging ;;
            *) echo "Unsupported monitoring environment" >&2; exit 1 ;;
          esac
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "Monitoring $DEPLOY_ENVIRONMENT must run from $expected_ref" >&2
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the dispatch commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Build the isolated artifact
        working-directory: ops/monitoring
        run: |
          ../../bin/6529 ci
          ../../bin/6529 run generate:check
          ../../bin/6529 run check
      - name: Authenticate to monitoring through its dedicated OIDC role
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_MONITORING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_MONITORING_REGION }}
          allowed-account-ids: ${{ vars.AWS_MONITORING_ACCOUNT_ID }}
          role-session-name: monitoring-${{ github.run_id }}
      - name: Deploy monitoring infrastructure
        if: inputs.operation != 'retire-competition-registration'
        working-directory: ops/monitoring
        env:
          AWS_CLI_PATH: /usr/local/bin/aws
          MONITORING_ENVIRONMENT: ${{ inputs.environment }}
          MONITORING_COMMIT_SHA: ${{ github.sha }}
          MONITORING_ACCOUNT_ID: ${{ vars.AWS_MONITORING_ACCOUNT_ID }}
          MONITORING_ARTIFACT_BUCKET: ${{ vars.AWS_MONITORING_ARTIFACT_BUCKET }}
          MONITORING_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_MONITORING_CFN_ROLE_ARN }}
          MONITORING_PARAMETERS: ${{ vars.MONITORING_PARAMETERS }}
        run: ../../bin/6529 run deploy
      - name: Remove only the retired competition producer registration
        id: retirement
        if: inputs.operation == 'retire-competition-registration'
        working-directory: ops/monitoring
        env:
          AWS_CLI_PATH: /usr/local/bin/aws
          MONITORING_ENVIRONMENT: ${{ inputs.environment }}
          MONITORING_COMMIT_SHA: ${{ github.sha }}
          MONITORING_ARTIFACT_BUCKET: ${{ vars.AWS_MONITORING_ARTIFACT_BUCKET }}
          MONITORING_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_MONITORING_CFN_ROLE_ARN }}
          RETIRE_STACK_KIND: monitoring
          RETIRE_APPLY: ${{ inputs.retirement_plan_sha256 != '' && 'true' || 'false' }}
          RETIRE_APPROVED_PLAN_SHA256: ${{ inputs.retirement_plan_sha256 }}
          RETIRE_EVIDENCE_DIR: ${{ runner.temp }}/competition-monitoring-retirement
        run: ../../bin/6529 exec tsx ../scripts/competition-storage-retirement/monitoring-cli.ts
      - name: Save retirement receipt
        if: inputs.operation == 'retire-competition-registration' && steps.retirement.outcome != 'skipped' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: competition-monitoring-retirement-${{ inputs.environment }}
          path: |
            ${{ runner.temp }}/competition-monitoring-retirement/receipt.json
            ${{ runner.temp }}/competition-monitoring-retirement/apply-started.json
          if-no-files-found: error
      - name: Verify monitoring health
        shell: bash
        env:
          MONITORING_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          ingress_url="$(aws cloudformation describe-stacks \
            --stack-name "seize-monitoring-$MONITORING_ENVIRONMENT" \
            --query 'Stacks[0].Outputs[?OutputKey==`IngressUrl`].OutputValue | [0]' \
            --output text)"
          if [[ ! "$ingress_url" =~ ^https://[a-z0-9]+\.execute-api\."$AWS_REGION"\.amazonaws\.com$ ]]; then
            echo "Unexpected monitoring health endpoint" >&2
            exit 1
          fi
          printf 'Monitoring health: %s/health\n' "$ingress_url"
          for attempt in {1..18}; do
            health="$(curl --fail --silent --show-error --max-time 15 "$ingress_url/health" || true)"
            if jq -e '.status == "ok"' <<< "$health" > /dev/null; then
              echo "Monitoring health is ok"
              exit 0
            fi
            sleep 10
          done
          echo "Monitoring did not report healthy queue receipts and webhook connectivity" >&2
          exit 1
