name: IPFS infrastructure and recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/ipfs/**'
      - '.github/workflows/ipfs-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipfs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: IPFS safety and recovery contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.17.1'
          cache: npm
      - run: ./bin/6529 ci
      - run: ./bin/6529 exec jest --config ops/ipfs/jest.config.cjs
      - name: Validate offline templates and shell syntax
        run: |
          python3 ops/ipfs/control.py validate
          bash -n ops/ipfs/build-kubo.sh
          bash -n ops/ipfs/bootstrap.sh
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/ipfs-pycache" python3 -m compileall -q ops/ipfs
      - name: Validate CloudFormation against AWS resource schemas
        run: |
          python3 -m venv "$RUNNER_TEMP/ipfs-cfn-tools"
          "$RUNNER_TEMP/ipfs-cfn-tools/bin/pip" install cfn-lint==1.46.0
          for kind in access storage compute edge; do
            python3 ops/ipfs/infrastructure.py "$kind" > "$RUNNER_TEMP/ipfs-$kind.json"
          done
          "$RUNNER_TEMP/ipfs-cfn-tools/bin/cfn-lint" "$RUNNER_TEMP"/ipfs-{access,storage,compute,edge}.json
  rehearsal:
    name: IPFS pinned build and isolated restore rehearsal
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Build the pinned Kubo/S3 binary and nginx package
        env:
          IPFS_SOURCE_SHA: ${{ github.sha }}
          IPFS_BUILD_OUTPUT: ${{ runner.temp }}/ipfs-release
        run: bash ops/ipfs/build-kubo.sh
      - name: Test against loopback S3 and HTTPS fixtures without AWS credentials
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          IPFS_TELEMETRY: 'off'
          DO_NOT_TRACK: '1'
        run: python3 ops/ipfs/rehearse.py "$RUNNER_TEMP/ipfs-release"
