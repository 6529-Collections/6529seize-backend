name: Operational monitoring checks
on:
  pull_request:
    paths:
      - 'ops/monitoring/**'
      - 'src/config/deploy-services.json'
      - 'src/operational-errors*'
      - 'src/logging.ts'
      - 'src/sentry.context.ts'
      - '.github/workflows/*operational-monitoring.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Install only monitoring dependencies
        working-directory: ops/monitoring
        run: ../../bin/6529 ci
      - name: Verify generated coverage and templates
        working-directory: ops/monitoring
        run: ../../bin/6529 run generate:check
      - name: Test and build the isolated package
        working-directory: ops/monitoring
        run: ../../bin/6529 run check
      - name: Validate SAM and CloudFormation schemas
        working-directory: ops/monitoring
        run: |
          pipx run --spec cfn-lint==1.40.4 cfn-lint bootstrap.json source-bootstrap.json monitoring-prod.json monitoring-staging.json source-prod.json source-staging.json
