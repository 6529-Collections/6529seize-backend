# Bootstrap separately with existing authority. These roles can only read live
# resource configuration, attach ownership tags and import into one fixed stack.
AWSTemplateFormatVersion: '2010-09-09'
Description: 6529 IPFS import-only access; configuration reads and ownership tags only
Parameters:
  GitHubOidcProviderArn:
    Type: String
  GitHubRepositorySubject:
    Type: String
    Default: repo:6529-Collections/6529seize-backend
    AllowedPattern: repo:6529-Collections(@[0-9]+)?/6529seize-backend(@[0-9]+)?
Resources:
  ReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Native configuration reads for exactly the imported production resources
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetAccelerateConfiguration
              - s3:GetLifecycleConfiguration
              - s3:GetBucketPublicAccessBlock
              - s3:GetAnalyticsConfiguration
              - s3:GetBucketCORS
              - s3:GetEncryptionConfiguration
              - s3:GetInventoryConfiguration
              - s3:GetBucketLogging
              - s3:GetMetricsConfiguration
              - s3:GetBucketNotification
              - s3:GetBucketVersioning
              - s3:GetReplicationConfiguration
              - s3:GetBucketWebsite
              - s3:GetBucketObjectLockConfiguration
              - s3:GetBucketTagging
              - s3:ListTagsForResource
              - s3:GetBucketAbac
              - s3:GetBucketOwnershipControls
              - s3:GetIntelligentTieringConfiguration
              - s3:GetBucketMetadataTableConfiguration
              - s3:ListBucket
            Resource: arn:aws:s3:::6529ipfs
          - Effect: Allow
            Action:
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:ListTagsForResource
            Resource: arn:aws:cloudfront::987989283142:distribution/E1D6I3Z3M5F0H4
          - Effect: Allow
            Action:
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeVolumes
              - ec2:DescribeInstances
              - ec2:DescribeInstanceAttribute
              - ec2:DescribeInstanceCreditSpecifications
              - ec2:DescribeLaunchTemplates
              - ec2:DescribeSecurityGroups
              - ssm:DescribeAssociation
              - ssm:ListAssociations
            # EC2 Describe actions require Resource '*'. This is read-only and
            # regional; no SSM command or content-object access is granted.
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: us-east-1
          - Effect: Deny
            Action:
              - s3:PutObject*
              - s3:PutBucketPolicy
              - s3:PutBucketPublicAccessBlock
              - s3:PutEncryptionConfiguration
              - s3:PutBucketVersioning
              - s3:PutBucketOwnershipControls
              - s3:PutLifecycleConfiguration
              - s3:Delete*
              - s3:Create*
              - ec2:RunInstances
              - ec2:TerminateInstances
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:RebootInstances
              - ec2:Modify*
              - ec2:Authorize*
              - ec2:Revoke*
              - ec2:DeleteTags
              - cloudfront:UpdateDistribution
              - cloudfront:DeleteDistribution
              - cloudfront:CreateDistribution
              - cloudfront:UntagResource
              - route53:ChangeResourceRecordSets
              - ssm:SendCommand
            # Defense in depth: neither role may change service configuration even
            # if an identity policy is later attached accidentally.
            Resource: '*'
  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: seize-ipfs-prod-adoption-service
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ReadPolicy
      Policies:
        - PolicyName: import-ownership-tags
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudFormation can attach ownership tags during import, even
              # though IMPORT never updates resource configuration. No caller
              # supplies custom stack tags. Existing Name tags are preserved.
              - Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - arn:aws:ec2:us-east-1:987989283142:instance/i-0012c6236ad1292e8
                  - arn:aws:ec2:us-east-1:987989283142:security-group/sg-03b5af7f71e361d25
                Condition:
                  ForAllValues:StringLike:
                    aws:TagKeys: ['aws:cloudformation:*', Name]
                  StringEqualsIfExists:
                    aws:RequestTag/Name: 6529-ipfs-server
              - Effect: Allow
                Action: cloudfront:TagResource
                Resource: arn:aws:cloudfront::987989283142:distribution/E1D6I3Z3M5F0H4
                Condition:
                  ForAllValues:StringLike:
                    aws:TagKeys: ['aws:cloudformation:*', Name]
                  StringEqualsIfExists:
                    aws:RequestTag/Name: ipfs-6529-cache
              - Effect: Allow
                # S3's tagging API replaces the tag set and has no tag-key IAM
                # condition. Restrict it to this exact bucket and service role.
                Action: s3:PutBucketTagging
                Resource: arn:aws:s3:::6529ipfs
  AdoptionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: seize-ipfs-prod-adopt
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Ref: GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  Fn::Sub: ${GitHubRepositorySubject}:environment:ipfs-prod
      ManagedPolicyArns:
        - Ref: ReadPolicy
      Policies:
        - PolicyName: import-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:GetResource
                  - cloudformation:ListStacks
                # Cloud Control GetResource does not support resource ARNs.
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:ListStackResources
                  - cloudformation:ListChangeSets
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:DetectStackResourceDrift
                  - cloudformation:UpdateTerminationProtection
                  - cloudformation:SetStackPolicy
                Resource: arn:aws:cloudformation:us-east-1:987989283142:stack/seize-ipfs-prod-adopted/*
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                Resource: arn:aws:cloudformation:us-east-1:987989283142:stack/seize-ipfs-prod-adopted/*
                Condition:
                  'Null':
                    cloudformation:ImportResourceTypes: 'false'
                  ForAllValues:StringEquals:
                    cloudformation:ImportResourceTypes:
                      - AWS::S3::Bucket
                      - AWS::EC2::Instance
                      - AWS::EC2::SecurityGroup
                      - AWS::CloudFront::Distribution
                  ArnEquals:
                    cloudformation:RoleArn:
                      Fn::GetAtt: [ServiceRole, Arn]
                  StringLike:
                    cloudformation:ChangeSetName: seize-ipfs-prod-import-*
              - Effect: Allow
                Action:
                  - cloudformation:ExecuteChangeSet
                Resource: arn:aws:cloudformation:us-east-1:987989283142:stack/seize-ipfs-prod-adopted/*
                Condition:
                  StringLike:
                    cloudformation:ChangeSetName: seize-ipfs-prod-import-*
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  Fn::GetAtt: [ServiceRole, Arn]
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
Outputs:
  AdoptionRoleArn:
    Value:
      Fn::GetAtt: [AdoptionRole, Arn]
  ServiceRoleArn:
    Value:
      Fn::GetAtt: [ServiceRole, Arn]
