AWSTemplateFormatVersion: '2010-09-09'
Description: Stable IPFS production front door with two reusable writer/gateway slots
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  CertificateArn:
    Type: String
  SlotAInstanceId:
    Type: AWS::EC2::Instance::Id
  SlotBInstanceId:
    Type: String
    Default: ''
    AllowedPattern: '^$|i-[a-f0-9]{17}'
  ActiveSlot:
    Type: String
    Default: a
    AllowedValues: [a, b]
Rules:
  ActiveSlotMustExist:
    RuleCondition:
      Fn::Equals: [{ Ref: ActiveSlot }, b]
    Assertions:
      - Assert:
          Fn::Not: [{ Fn::Equals: [{ Ref: SlotBInstanceId }, ''] }]
        AssertDescription: Slot b requires an explicitly registered instance
Conditions:
  SlotAActive:
    Fn::Equals: [{ Ref: ActiveSlot }, a]
  HasSlotB:
    Fn::Not: [{ Fn::Equals: [{ Ref: SlotBInstanceId }, ''] }]
Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: IPFS public TLS; target hosts restrict ingress to this group
      VpcId: { Ref: VpcId }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Service
          Value: 6529-ipfs
        - Key: Environment
          Value: prod
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: seize-ipfs-prod
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: { Ref: SubnetIds }
      SecurityGroups: [{ Ref: SecurityGroup }]
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: 'true'
        - Key: idle_timeout.timeout_seconds
          Value: '1800'
        - Key: routing.http.preserve_host_header.enabled
          Value: 'true'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Tags:
        - Key: Service
          Value: 6529-ipfs
        - Key: Environment
          Value: prod
  WriterA:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: seize-ipfs-prod-writer-a
      VpcId: { Ref: VpcId }
      Protocol: HTTPS
      Port: 443
      TargetType: instance
      Targets: [{ Id: { Ref: SlotAInstanceId } }]
      HealthCheckPath: /health
      HealthCheckProtocol: HTTPS
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '1800'
      Tags:
        - Key: Service
          Value: 6529-ipfs
        - Key: Environment
          Value: prod
  WriterB:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: seize-ipfs-prod-writer-b
      VpcId: { Ref: VpcId }
      Protocol: HTTPS
      Port: 443
      TargetType: instance
      Targets:
        Fn::If: [HasSlotB, [{ Id: { Ref: SlotBInstanceId } }], []]
      HealthCheckPath: /health
      HealthCheckProtocol: HTTPS
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '1800'
      Tags:
        - Key: Service
          Value: 6529-ipfs
        - Key: Environment
          Value: prod
  GatewayA:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: seize-ipfs-prod-gateway-a
      VpcId: { Ref: VpcId }
      Protocol: HTTPS
      Port: 443
      TargetType: instance
      Targets: [{ Id: { Ref: SlotAInstanceId } }]
      HealthCheckPath: /health
      HealthCheckProtocol: HTTPS
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '1800'
      Tags:
        - Key: Service
          Value: 6529-ipfs
        - Key: Environment
          Value: prod
  GatewayB:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: seize-ipfs-prod-gateway-b
      VpcId: { Ref: VpcId }
      Protocol: HTTPS
      Port: 443
      TargetType: instance
      Targets:
        Fn::If: [HasSlotB, [{ Id: { Ref: SlotBInstanceId } }], []]
      HealthCheckPath: /health
      HealthCheckProtocol: HTTPS
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '1800'
      Tags:
        - Key: Service
          Value: 6529-ipfs
        - Key: Environment
          Value: prod
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: { Ref: LoadBalancer }
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: { Ref: CertificateArn } }]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            {
              StatusCode: '403',
              ContentType: text/plain,
              MessageBody: Forbidden
            }
  ApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: { Ref: Listener }
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig: { Values: [api-ipfs.6529.io] }
      Actions:
        - Type: forward
          # Retaining both groups with zero weight on the inactive slot keeps
          # health checks and rollback readiness available throughout handover.
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: { Ref: WriterA }
                Weight: { Fn::If: [SlotAActive, 100, 0] }
              - TargetGroupArn: { Ref: WriterB }
                Weight: { Fn::If: [SlotAActive, 0, 100] }
  ValidationRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: { Ref: Listener }
      Priority: 5
      Conditions:
        - Field: host-header
          HostHeaderConfig: { Values: [ipfs-runtime-check.6529.io] }
      Actions:
        - Type: forward
          TargetGroupArn:
            { Fn::If: [SlotAActive, { Ref: WriterB }, { Ref: WriterA }] }
  GatewayRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: { Ref: Listener }
      Priority: 20
      Conditions:
        - Field: host-header
          HostHeaderConfig: { Values: [ipfs-origin.6529.io] }
      Actions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: { Ref: GatewayA }
                Weight: { Fn::If: [SlotAActive, 100, 0] }
              - TargetGroupArn: { Ref: GatewayB }
                Weight: { Fn::If: [SlotAActive, 0, 100] }
Outputs:
  DnsName:
    Value:
      Fn::GetAtt: [LoadBalancer, DNSName]
  HostedZoneId:
    Value:
      Fn::GetAtt: [LoadBalancer, CanonicalHostedZoneID]
  LoadBalancerArn:
    Value: { Ref: LoadBalancer }
  SecurityGroupId:
    Value: { Ref: SecurityGroup }
  WriterAArn:
    Value: { Ref: WriterA }
  WriterBArn:
    Value: { Ref: WriterB }
  GatewayAArn:
    Value: { Ref: GatewayA }
  GatewayBArn:
    Value: { Ref: GatewayB }
