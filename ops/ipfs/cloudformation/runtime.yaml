AWSTemplateFormatVersion: '2010-09-09'
Description: Immutable production IPFS replacement; initially reads existing blocks without writes
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  ImageId:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.large, t3.xlarge, m7i.large]
  FrontdoorSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
  RuntimePeerSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
  SourceSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
  RuntimeBoundaryArn:
    Type: String
  AllowWrites:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
  PublishSwarm:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
Conditions:
  WritesAllowed:
    Fn::Equals: [{ Ref: AllowWrites }, 'true']
  SwarmPublished:
    Fn::Equals: [{ Ref: PublishSwarm }, 'true']
Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${AWS::StackName}-runtime
      PermissionsBoundary:
        Ref: RuntimeBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: content-and-recovery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: arn:aws:s3:::6529ipfs
                Condition:
                  StringLike:
                    s3:prefix: [ipfs, ipfs/*]
              - Effect: Allow
                Action: s3:GetObject
                Resource: arn:aws:s3:::6529ipfs/ipfs/*
              - Fn::If:
                  - WritesAllowed
                  - Effect: Allow
                    Action: s3:PutObject
                    Resource: arn:aws:s3:::6529ipfs/ipfs/*
                  - Ref: AWS::NoValue
              - Effect: Deny
                Action: [s3:DeleteObject, s3:DeleteObjectVersion]
                Resource: arn:aws:s3:::6529ipfs/*
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: arn:aws:s3:::seize-ipfs-prod-recovery-backups-987989283142/prod/transfers/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: arn:aws:s3:::seize-ipfs-prod-recovery-backups-987989283142/prod/private/runtime/*
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: arn:aws:s3:::seize-ipfs-prod-recovery-artifacts-987989283142/prod/*
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName:
        Fn::Sub: ${AWS::StackName}-runtime
      Roles: [{ Ref: Role }]
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Restricted IPFS HTTPS plus the existing public TCP swarm service
      VpcId:
        Ref: VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId:
            Ref: FrontdoorSecurityGroup
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId:
            Ref: SourceSecurityGroup
        - Fn::If:
            - SwarmPublished
            - IpProtocol: tcp
              FromPort: 4001
              ToPort: 4001
              CidrIp: 0.0.0.0/0 # NOSONAR: preserve IPFS peering only after security updates and reboot validation; RPC/gateway/SSH stay private.
            - Ref: AWS::NoValue
      Tags:
        - Key: Service
          Value: 6529-ipfs
        - Key: Environment
          Value: prod
  Instance:
    Type: AWS::EC2::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageId:
        Ref: ImageId
      InstanceType:
        Ref: InstanceType
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true # NOSONAR: outbound SSM/S3 in the existing public subnet; HTTPS is restricted and the original TCP swarm service is preserved.
          SubnetId:
            Ref: SubnetId
          GroupSet: [{ Ref: SecurityGroup }, { Ref: RuntimePeerSecurityGroup }]
      IamInstanceProfile:
        Ref: Profile
      DisableApiTermination: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
      Tags:
        - Key: Service
          Value: 6529-ipfs
        - Key: Environment
          Value: prod
        - Key: IpfsRole
          Value: candidate
        - Key: Name
          Value:
            Fn::Sub: ${AWS::StackName}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=600 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold full-upgrade -y
          apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=600 install -y --no-install-recommends python3 curl ca-certificates openssl unzip
          # The Noble AMI has no apt candidate for awscli. This archive's hash
          # was checked after verifying the detached AWS CLI Team signature.
          cli_dir=$(mktemp -d)
          trap 'rm -rf -- "$cli_dir"' EXIT
          curl -fsSL --proto '=https' --retry 3 --max-time 180 \
            -o "$cli_dir/awscli.zip" https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.39.6.zip
          printf '%s  %s\n' '7a121264f2637a3b90767aaf5bdd43ee88b8c925a931d0479fa2ce22b1a2fa76' "$cli_dir/awscli.zip" | sha256sum --check --status
          unzip -q "$cli_dir/awscli.zip" -d "$cli_dir"
          "$cli_dir/aws/install" --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli
          /usr/local/bin/aws --version
          install -d -m 700 /etc/6529-ipfs
          printf '%s\n' '{"environment":"prod","role":"candidate"}' > /etc/6529-ipfs/managed.json
          chmod 600 /etc/6529-ipfs/managed.json
          systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service
  InstanceHealth:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: { Fn::Sub: '${AWS::StackName}-instance-health' }
      AlarmDescription: Managed IPFS runtime EC2 status checks must pass
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      Dimensions:
        - Name: InstanceId
          Value: { Ref: Instance }
Outputs:
  InstanceId:
    Value: { Ref: Instance }
  PrivateIp:
    Value:
      Fn::GetAtt: [Instance, PrivateIp]
  SecurityGroupId:
    Value: { Ref: SecurityGroup }
  RuntimeRoleArn:
    Value:
      Fn::GetAtt: [Role, Arn]
  HealthAlarm:
    Value: { Ref: InstanceHealth }
