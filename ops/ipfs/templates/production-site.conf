server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate @API_CERT@;
    ssl_certificate_key @API_KEY@;
    location = /health {
        proxy_method POST;
        proxy_pass http://127.0.0.1:5001/api/v0/version;
        add_header Cache-Control no-store always;
    }
    location / { return 403; }
}
server {
    listen 443 ssl;
    server_name api-ipfs.6529.io ipfs-runtime-check.6529.io;
    ssl_certificate @API_CERT@;
    ssl_certificate_key @API_KEY@;
    location = /api/v0/add {
        limit_req zone=ipfs_managed_add nodelay;
        client_max_body_size 50m;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_http_version 1.1;
        proxy_pass $ipfs_api_upstream;
        proxy_set_header Host api-ipfs.6529.io;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-6529-IPFS-Hop $ipfs_hop;
        proxy_ssl_server_name on;
        proxy_ssl_name api-ipfs.6529.io;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
    location = /health {
        proxy_method POST;
        proxy_pass http://127.0.0.1:5001/api/v0/version;
        add_header Cache-Control no-store always;
    }
    location /ipfs/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 120s;
    }
    location / { return 403; }
}
server {
    listen 443 ssl;
    server_name ipfs.6529.io ipfs-origin.6529.io;
    ssl_certificate @GATEWAY_CERT@;
    ssl_certificate_key @GATEWAY_KEY@;
    location = /health {
        proxy_method POST;
        proxy_pass http://127.0.0.1:5001/api/v0/version;
    }
    location / {
        proxy_pass $ipfs_gateway_upstream;
        proxy_read_timeout 1800s;
        proxy_set_header Host ipfs-origin.6529.io;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name ipfs-origin.6529.io;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_hide_header Cache-Control;
        expires off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
server {
    listen 80;
    server_name api-ipfs.6529.io ipfs.6529.io ipfs-origin.6529.io;
    return 301 https://$host$request_uri;
}
