user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=ipfs_add:10m rate=6r/m;
    ssl_certificate /etc/letsencrypt/live/6529-ipfs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/6529-ipfs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    map $status $ipfs_cache_control {
        default "no-store";
        200 "public, max-age=2592000, immutable";
        206 "public, max-age=2592000, immutable";
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        return 444;
    }
    server {
        listen 443 ssl;
        server_name @ORIGIN_HOST@;
        location /ipfs/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_read_timeout 120s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control $ipfs_cache_control always;
        }
        location /ipns/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_read_timeout 120s;
        }
        location / { return 403; }
    }
    server {
        listen 443 ssl;
        server_name @API_HOST@;
        location = /api/v0/add {
            limit_req zone=ipfs_add nodelay;
            limit_req_status 429;
            client_max_body_size 50m;
            proxy_pass http://127.0.0.1:5001;
            proxy_read_timeout 120s;
        }
        location = /health {
            proxy_method POST;
            proxy_pass http://127.0.0.1:5001/api/v0/version;
            add_header Cache-Control no-store always;
        }
        location / { return 403; }
    }
}
